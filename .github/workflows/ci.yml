name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '20'
            python: '3.9'
          - os: macos-15
            node: '22'
            python: '3.12'
          - os: windows-2022
            node: '22'
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run verify
      - run: npm run verify:stdio
      - run: npm run pack:source
